<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>이동 중…</title>
<meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
/* 학교 전용 주소 처리 (학교별 폴더 없이 이 파일 하나로 동작)
   1) /s/<학교id>/           → /?school=<학교id>&lock=1
   2) /<학교id>/  (옛 형식)   → schools.json에 그 id가 있으면 같은 곳으로 이동 */
(function(){
  var path = location.pathname.replace(/\/index\.html$/,"");
  var hash = location.hash || "#home";
  function go(base, id){ location.replace(base + "?school=" + encodeURIComponent(id.toLowerCase()) + "&lock=1" + hash); }
  var m = path.match(/^(.*?)\/s\/([A-Za-z0-9_-]+)\/?$/);
  if(m){ go(m[1] + "/", m[2]); return; }
  m = path.match(/^(.*?)\/([A-Za-z0-9_-]+)\/?$/);
  if(m){
    var base = m[1] + "/", id = m[2].toLowerCase();
    fetch(base + "schools.json", {cache:"no-cache"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      var ok = false;
      if(j && j.regions) j.regions.forEach(function(r){ (r.districts||[]).forEach(function(d){ (d.schools||[]).forEach(function(s){ if(String(s.id).toLowerCase()===id) ok=true; }); }); });
      if(ok) go(base, id); else show(base);
    }).catch(function(){ show(""); });
    return;
  }
  show("");
  function show(base){
    function f(){ var el=document.getElementById("nf"); el.style.display="block"; if(base) document.getElementById("home").href=base; }
    if(document.readyState!=="loading") f(); else document.addEventListener("DOMContentLoaded", f);
  }
})();
</script>
<style>body{font-family:-apple-system,"Malgun Gothic",sans-serif;padding:48px 24px;color:#334;max-width:560px;margin:0 auto;line-height:1.7}#nf{display:none}a{color:#2258ff}code{background:#f2f4f9;padding:2px 6px;border-radius:6px}</style>
</head><body>
<div id="nf"><h2>페이지를 찾을 수 없어요</h2><p>학교 전용 주소는 <code>…/s/학교id/</code> 형태예요.<br>주소를 다시 확인하거나 <a id="home" href="./">홈으로</a> 이동하세요.</p></div>
</body></html>
